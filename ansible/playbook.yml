---
- name: Desplegar la API de inventario de juegos Nintendo Switch
  hosts: app
  become: true
  vars:
    app_dir: /opt/app

  tasks:
    - name: Instalar dependencias del sistema
      ansible.builtin.apt:
        name:
          - python3
          - python3-venv
          - python3-pip
        update_cache: true
        state: present

    - name: Crear directorio de la aplicación
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copiar código de la aplicación
      ansible.builtin.copy:
        src: ../app/
        dest: "{{ app_dir }}/"
        owner: ubuntu
        group: ubuntu
      notify: Reiniciar app

    - name: Instalar requirements en un entorno virtual
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv
      become_user: ubuntu
      notify: Reiniciar app

    - name: Crear servicio systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/app.service
        mode: "0644"
        content: |
          [Unit]
          Description=Inventario de juegos Nintendo Switch (gunicorn)
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory={{ app_dir }}
          ExecStart={{ app_dir }}/venv/bin/gunicorn -w 2 -b 0.0.0.0:{{ app_port }} main:app
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify: Reiniciar app

    - name: Habilitar e iniciar el servicio
      ansible.builtin.systemd:
        name: app
        enabled: true
        state: started
        daemon_reload: true

    - name: Verificar que la aplicación responde
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        status_code: 200
      register: health
      retries: 5
      delay: 3
      until: health.status == 200

  handlers:
    - name: Reiniciar app
      ansible.builtin.systemd:
        name: app
        state: restarted
        daemon_reload: true
